name: Release

# Publishes @agent-ix/cli-agent-evals to public npm via the shared reusable in
# nodejs-actions (make install/test/lint/build, then npm publish).
# The filename must stay release.yml: that is what the package's Trusted
# Publisher entry on npmjs.com matches.

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing

jobs:
  release:
    uses: agent-ix/nodejs-actions/.github/workflows/release.yml@main
    with:
      npm_registry: https://registry.npmjs.org
      # First-publish form: token auth (trusted_publish: true blanks the token).
      # A follow-up flips this to true, and drops the secret, once the first
      # publish and the npm Trusted Publisher entry exist.
      trusted_publish: false
      node_version: "22"
    secrets:
      # Temporary repo secret NPM_TOKEN, first publish only.
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_TOKEN }}
